name: Deploy SDK

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

jobs:
  deploy-to-pub-dev:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for authentication using OIDC
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Dart
        uses: dart-lang/setup-dart@2286a0c042b44434fe26d292bbce8d34f7ec662b # v1
        with:
          sdk: 3.4.4

      - name: Setup Flutter SDK
        uses: flutter-actions/setup-flutter@c7fdb36b173fc3e88e5c5a3733c2b66bd9ac91a1 # v3
        with:
          version: latest
          channel: stable

      - name: Deploy platform_interface
        run: |
          cd ortto_flutter_sdk_platform_interface
          flutter pub get
          flutter pub publish -f || true

      - name: Deploy sdk_ios
        run: | 
          cd ortto_flutter_sdk_ios 
          dart pub publish -f || true

      - name: Deploy sdk_android
        run: |
          cd ortto_flutter_sdk_android 
          dart pub publish -f || true

      - name: Deploy sdk
        run: |
          cd ortto_flutter_sdk 
          dart pub publish -f || true
