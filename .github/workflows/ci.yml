name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart:
    name: ${{ matrix.package }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        package:
          - ortto_flutter_sdk_platform_interface
          - ortto_flutter_sdk_ios
          - ortto_flutter_sdk_android
          - ortto_flutter_sdk
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
